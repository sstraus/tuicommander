[package]
name = "tuic-cli"
version.workspace = true
description = "CLI companion for TUICommander — editor opener, session multiplexer, tmux replacement"
authors = ["Stefano Straus <github.com/sstraus>"]
edition = "2024"

[[bin]]
name = "tuic"
path = "src/main.rs"

[dependencies]
tuic-ipc = { path = "../tuic-ipc" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
dirs = "7"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Pipes"] }

[dev-dependencies]
tuic-test-support = { path = "../tuic-test-support" }
tempfile = "3"

[lints]
workspace = true
