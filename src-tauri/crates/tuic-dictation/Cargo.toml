[package]
name = "tuic-dictation"
version.workspace = true
edition = "2024"

[features]
default = []
cuda = ["whisper-rs/cuda"]
vulkan = ["whisper-rs/vulkan"]

[dependencies]
tuic-core = { path = "../tuic-core", features = ["audio-output"] }
cpal = "0.17.3"
# symphonia-mp3: the Edge speech service answers in MP3.
rodio = { version = "0.22.2", default-features = false, features = ["playback", "symphonia-mp3"] }
whisper-rs = "0.16"
# Pocket TTS loads the runtime library shipped with its downloaded model. A
# build-time download would make this native dependency harder to bundle.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic"] }
# The bundles use SentencePiece Unigram; the C++ sentencepiece crate links a
# protobuf version that conflicts with onnxruntime.
sentencepiece-model = "0.1"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
safetensors = "0.6"
# Bundled WebRTC APM avoids a system-library dependency across the three OSes.
webrtc-audio-processing = { version = "2.1.0", features = ["bundled"] }
parking_lot = "0.12"
# The Edge speech service is a blocking WebSocket with a read timeout, so a
# cancelled reply stops within 100 ms. Same version and TLS stack as the
# tokio-tungstenite the application already ships.
tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
rand = "0.10"
tracing = "0.1"
flate2 = "1.1"
tar = "0.4"
# DEFERRED (2026-10-09) — share the root's ZIP codecs; retain extraction compatibility.
zip = "8"

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSUserDefaults", "NSDictionary", "NSString", "NSValue"] }
block2 = "0.6"

[dev-dependencies]
tuic-core = { path = "../tuic-core", features = ["test-support"] }
tuic-test-support = { path = "../tuic-test-support" }
# Same provider the application installs at startup, for the ignored live test.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[lints]
workspace = true
