# cargo-nextest configuration.
# Runs each test in its own process — the isolation that #[serial] provided
# in-process is now provided by the OS, so serial-marked tests stay correct
# (the serial_test mutex is per-process and simply never contends under nextest).
experimental = ["setup-scripts"]

[scripts.setup.repo-test-temp-unix]
command = "sh scripts/nextest-test-tmp.sh"

[scripts.setup.repo-test-temp-windows]
command = "powershell -NoProfile -File scripts/nextest-test-tmp.ps1"

# The bin fixtures are consumed by lib unit tests that derive their path from
# current_exe: mcp_proxy::stdio_client::tests, the registry respawn test, the ACP
# push test in state.rs, and acp_chat::tests::custom_chat_*. Integration tests reach the same bins through
# CARGO_BIN_EXE_*, which cargo itself builds. Every setup entry below is
# filtered to those consumers, so a run that selects none of them skips the
# ~5 min build (#1308-50c9). A new lib unit test that spawns a fixture bin must
# be added to the filter; scripts/check-nextest-fixture-scope.sh guards it.
[scripts.setup.fixture-bins-unix]
command = "sh scripts/build-fixture-bins.sh"

[scripts.setup.fixture-bins-windows]
command = "powershell -NoProfile -File scripts/build-fixture-bins.ps1"

# These integration tests spawn the separately packaged real relay. Download
# and compile it once in setup, never twice inside their 120s behavior budget.
[scripts.setup.relay-bin-unix]
command = "python3 scripts/build-relay-test.py"

[scripts.setup.relay-bin-windows]
command = "python scripts/build-relay-test.py"

[profile.default]
# Surface long-running tests (warn at 30s, 60s, 90s) and hard-kill true hangs
# at 120s. The slowest legit tests here are the tunnels supervisor retry tests
# (~7s), so the 30s warn threshold never fires falsely.
slow-timeout = { period = "30s", terminate-after = 4 }

[[profile.default.scripts]]
platform = { host = "cfg(unix)" }
setup = "repo-test-temp-unix"

[[profile.default.scripts]]
platform = { host = "cfg(windows)" }
setup = "repo-test-temp-windows"

[[profile.default.scripts]]
platform = { host = "cfg(unix)" }
filter = 'binary_id(=tuicommander) & (test(/^mcp_proxy::stdio_client::tests::/) | test(=mcp_proxy::registry::tests::registry_respawns_an_exited_stdio_upstream) | test(=state::tests::live_acp_permission_reaches_one_subscribed_push_service) | test(/^acp_chat::tests::custom_chat_/))'
setup = "fixture-bins-unix"

[[profile.default.scripts]]
platform = { host = "cfg(windows)" }
filter = 'binary_id(=tuicommander) & (test(/^mcp_proxy::stdio_client::tests::/) | test(=mcp_proxy::registry::tests::registry_respawns_an_exited_stdio_upstream) | test(=state::tests::live_acp_permission_reaches_one_subscribed_push_service) | test(/^acp_chat::tests::custom_chat_/))'
setup = "fixture-bins-windows"

# The git_reads parity/shootout tests each spawn several `git` subprocesses in
# their own TempDir fixture. Under the full parallel run they occasionally hit
# transient git-subprocess contention (observed: cli_parity_with_legacy failing
# once, passing on re-run and in isolation — observed 2026-07-06 on
# cli_parity_with_legacy). Run the group serially.
[test-groups]
git-subprocess = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'test(/^git_reads::tests::/)'
test-group = 'git-subprocess'

# Explicitly ignored request-volume measurement: two real 60s windows plus
# rate-limit checks need more than the routine 120s bound. Its own hang bound
# is 300s; the outer harness must be strictly larger.
[[profile.default.overrides]]
filter = 'test(=github_poller::volume_measurement_1995::measure_github_client_fixture_1995)'
slow-timeout = { period = "30s", terminate-after = 12 }

[profile.ci]
# On CI, keep going after a failure so a run reports every failing test, and
# retry twice to absorb infrastructure flakiness (shared runners, port races).
# Local runs use the default profile (no retries) so flakes surface honestly.
fail-fast = false
retries = { backoff = "fixed", count = 2, delay = "1s" }
slow-timeout = { period = "30s", terminate-after = 4 }

[[profile.ci.scripts]]
platform = { host = "cfg(unix)" }
setup = "repo-test-temp-unix"

[[profile.ci.scripts]]
platform = { host = "cfg(windows)" }
setup = "repo-test-temp-windows"

[[profile.ci.scripts]]
platform = { host = "cfg(unix)" }
filter = 'binary_id(=tuicommander) & (test(/^mcp_proxy::stdio_client::tests::/) | test(=mcp_proxy::registry::tests::registry_respawns_an_exited_stdio_upstream) | test(=state::tests::live_acp_permission_reaches_one_subscribed_push_service) | test(/^acp_chat::tests::custom_chat_/))'
setup = "fixture-bins-unix"

[[profile.ci.scripts]]
platform = { host = "cfg(windows)" }
filter = 'binary_id(=tuicommander) & (test(/^mcp_proxy::stdio_client::tests::/) | test(=mcp_proxy::registry::tests::registry_respawns_an_exited_stdio_upstream) | test(=state::tests::live_acp_permission_reaches_one_subscribed_push_service) | test(/^acp_chat::tests::custom_chat_/))'
setup = "fixture-bins-windows"

[profile.ci.junit]
path = "junit.xml"

[[profile.default.scripts]]
platform = { host = "cfg(unix)" }
filter = 'binary_id(=tuicommander) & (test(=remote_runtime::relay_tests::desktop_attaches_through_the_relay_and_runs_a_command) | test(=remote_runtime::relay_tests::relay_loss_and_daemon_restart_recover_without_duplicate_sessions))'
setup = "relay-bin-unix"

[[profile.default.scripts]]
platform = { host = "cfg(windows)" }
filter = 'binary_id(=tuicommander) & (test(=remote_runtime::relay_tests::desktop_attaches_through_the_relay_and_runs_a_command) | test(=remote_runtime::relay_tests::relay_loss_and_daemon_restart_recover_without_duplicate_sessions))'
setup = "relay-bin-windows"


[[profile.ci.scripts]]
platform = { host = "cfg(unix)" }
filter = 'binary_id(=tuicommander) & (test(=remote_runtime::relay_tests::desktop_attaches_through_the_relay_and_runs_a_command) | test(=remote_runtime::relay_tests::relay_loss_and_daemon_restart_recover_without_duplicate_sessions))'
setup = "relay-bin-unix"

[[profile.ci.scripts]]
platform = { host = "cfg(windows)" }
filter = 'binary_id(=tuicommander) & (test(=remote_runtime::relay_tests::desktop_attaches_through_the_relay_and_runs_a_command) | test(=remote_runtime::relay_tests::relay_loss_and_daemon_restart_recover_without_duplicate_sessions))'
setup = "relay-bin-windows"
