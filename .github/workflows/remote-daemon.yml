name: Remote daemon

# Builds tuic-remote and tuic-bridge for every daemon target and uploads them to a
# GitHub release. Called by release.yml (v* tags) and nightly.yml (rolling `nightly`
# release) so both ship the same binaries under the same asset names.

on:
  workflow_call:
    inputs:
      nightly:
        description: >-
          Upload to the rolling `nightly` release and stamp the build with the
          nightly version instead of uploading to v<tauri.conf.json version>.
        type: boolean
        default: false

# Workflow-level env is not inherited from the caller, so the pins live here.
# sccache's 600s idle timer counts time without *new* requests, so the final
# single-codegen-unit compile of the tuicommander lib outlives it and the in-flight
# rustc dies; 0 keeps the server alive for the whole job. It sits at workflow level
# because sccache-action starts the server, so a step-level value would never reach it.
#
# RUST_VERSION pins the compiler so a new stable cannot change what ships. Bump it
# in lockstep with ci.yml, release.yml, nightly.yml and audit.yml — see the note in
# ci.yml and docs/guides/ci.md.
env:
  SCCACHE_IDLE_TIMEOUT: "0"
  RUST_VERSION: "1.99.1"

jobs:
  remote-daemon:
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
            ext: ''
          - platform: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            label: linux-arm64
            ext: ''
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
            ext: '.exe'
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
            ext: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
        with:
          # src/plugins.rs embeds the bundled plugins with include_str!, and
          # they live in the `plugins` submodule. Without this the crate
          # cannot compile at all.
          submodules: recursive

      - name: Check tag matches version
        if: github.ref_type == 'tag'
        shell: bash
        run: bash scripts/check-release-tag.sh "$GITHUB_REF_NAME"

      # Same stamp the desktop legs get, so /health.build.version of a nightly
      # daemon reads as a nightly, not as the stable it was branched from.
      - name: Patch nightly version
        if: inputs.nightly
        shell: bash
        run: bash scripts/patch-nightly-version.sh

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev mold

      - name: Install cross-compilation tools (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> $GITHUB_ENV

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build tuic-remote
        working-directory: src-tauri
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_RELEASE_STRIP: 'true'
          RUSTFLAGS: ${{ startsWith(matrix.platform, 'ubuntu') && matrix.target != 'aarch64-unknown-linux-gnu' && '-C link-arg=-fuse-ld=mold' || '' }}
        run: cargo build --release --no-default-features --bin tuic-remote --target ${{ matrix.target }}

      # The daemon writes an MCP config for every agent on its machine, and that
      # config names `tuic-bridge`. Shipping the daemon without it configured
      # agents to run a binary that was never published for their platform
      # (#793-23a5). Its own crate, three small dependencies — it costs seconds.
      - name: Build tuic-bridge
        working-directory: src-tauri
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_RELEASE_STRIP: 'true'
          RUSTFLAGS: ${{ startsWith(matrix.platform, 'ubuntu') && matrix.target != 'aarch64-unknown-linux-gnu' && '-C link-arg=-fuse-ld=mold' || '' }}
        run: cargo build --release --package tuic-bridge --target ${{ matrix.target }}

      - name: Check named-instance CLI contract (Unix)
        # The Linux ARM artifact is cross-compiled on x64 and cannot run here.
        if: matrix.platform != 'windows-latest' && matrix.target != 'aarch64-unknown-linux-gnu'
        working-directory: src-tauri
        shell: bash
        run: |
          set +e
          OUTPUT=$(perl -e 'alarm 10; exec @ARGV' ./target/${{ matrix.target }}/release/tuic-remote --instance default 2>&1)
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 1 ]; then
            echo "Reserved instance ID did not fail with the expected CLI error (status $STATUS)"
            printf '%s\n' "$OUTPUT"
            exit 1
          fi
          if ! grep -Fq 'Invalid application instance "default"' <<<"$OUTPUT"; then
            echo "Reserved instance ID did not report the expected diagnostic"
            printf '%s\n' "$OUTPUT"
            exit 1
          fi

      - name: Check named-instance CLI contract (Windows)
        if: matrix.platform == 'windows-latest'
        working-directory: src-tauri
        shell: pwsh
        run: |
          $errorPath = Join-Path $env:RUNNER_TEMP "tuic-instance-error-$PID.txt"
          $proc = Start-Process -FilePath "target/${{ matrix.target }}/release/tuic-remote.exe" -ArgumentList "--instance", "default" -RedirectStandardError $errorPath -PassThru -NoNewWindow
          if (-not $proc.WaitForExit(10000)) {
            Stop-Process -Id $proc.Id -Force
            throw "Reserved instance ID did not fail within 10 seconds"
          }
          if ($proc.ExitCode -ne 1) {
            throw "Reserved instance ID did not fail with the expected CLI error (status $($proc.ExitCode))"
          }
          $diagnostic = Get-Content -Raw -Path $errorPath
          if ($diagnostic -notmatch 'Invalid application instance "default"') {
            throw "Reserved instance ID did not report the expected diagnostic: $diagnostic"
          }

      - name: Smoke test (Linux x64)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        working-directory: src-tauri
        run: |
          ./target/${{ matrix.target }}/release/tuic-remote &
          PID=$!
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:9877/health | grep -q '"ok":true'; then
              echo "Health check passed after ${i}s"
              kill $PID
              exit 0
            fi
            sleep 1
          done
          echo "Health check failed after 15s"
          kill $PID 2>/dev/null
          exit 1

      - name: Smoke test (macOS)
        if: startsWith(matrix.platform, 'macos-')
        working-directory: src-tauri
        run: |
          ./target/${{ matrix.target }}/release/tuic-remote &
          PID=$!
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:9877/health | grep -q '"ok":true'; then
              echo "Health check passed after ${i}s"
              kill $PID
              exit 0
            fi
            sleep 1
          done
          echo "Health check failed after 15s"
          kill $PID 2>/dev/null
          exit 1

      - name: Smoke test (Windows)
        if: matrix.platform == 'windows-latest'
        working-directory: src-tauri
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "target/${{ matrix.target }}/release/tuic-remote.exe" -PassThru -NoNewWindow
          for ($i = 1; $i -le 15; $i++) {
            try {
              $resp = Invoke-WebRequest -Uri "http://127.0.0.1:9877/health" -UseBasicParsing -ErrorAction Stop
              if ($resp.Content -match '"ok":true') {
                Write-Host "Health check passed after ${i}s"
                Stop-Process -Id $proc.Id -Force
                exit 0
              }
            } catch {}
            Start-Sleep -Seconds 1
          }
          Write-Host "Health check failed after 15s"
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          exit 1

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [ "${{ inputs.nightly }}" = "true" ]; then
            TAG=nightly
          else
            TAG="v$(jq -r '.version' src-tauri/tauri.conf.json)"
          fi
          ASSETS=""
          for BIN in tuic-remote tuic-bridge; do
            ASSET="${BIN}-${{ matrix.target }}${{ matrix.ext }}"
            cp "src-tauri/target/${{ matrix.target }}/release/${BIN}${{ matrix.ext }}" "$ASSET"
            ASSETS="$ASSETS $ASSET"
          done
          # Nightly cleanup creates the release before this job starts.
          # shellcheck disable=SC2086 — the asset names carry no spaces.
          gh release upload "${TAG}" $ASSETS --clobber
