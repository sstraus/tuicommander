name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# sccache's 600s idle timer counts time without *new* requests, so the final
# single-codegen-unit compile of the tuicommander lib — well over ten minutes on
# the Windows runner — outlives it: the server exits and the in-flight rustc dies
# with "connection forcibly closed" (os error 10054). 0 keeps the server alive for
# the whole job. It sits at workflow level because sccache-action starts the
# server, so a step-level value would never reach it.
#
# RUST_VERSION pins the compiler so a new stable cannot change what ships. Bump it
# in lockstep with ci.yml, nightly.yml, remote-daemon.yml and audit.yml — see the note in ci.yml and
# docs/guides/ci.md.
env:
  SCCACHE_IDLE_TIMEOUT: "0"
  RUST_VERSION: "1.99.1"

jobs:
  build:
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            label: macOS-ARM
          - platform: ubuntu-22.04
            args: ''
            label: Linux-x64
          - platform: windows-latest
            args: '--bundles nsis'
            label: Windows-x64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
        with:
          # src/plugins.rs embeds the bundled plugins with include_str!, and
          # they live in the `plugins` submodule. Without this the crate
          # cannot compile at all.
          submodules: recursive

      # shell: bash — the Windows leg defaults to pwsh, where "$GITHUB_REF_NAME"
      # and "$GITHUB_OUTPUT" are unset PowerShell variables.
      - name: Check tag matches version
        if: github.ref_type == 'tag'
        shell: bash
        run: bash scripts/check-release-tag.sh "$GITHUB_REF_NAME"

      # A prerelease version (2.0.0-beta.1) must never become "latest": the stable
      # updater endpoint and install scripts read releases/latest.
      - name: Release flags
        id: flags
        shell: bash
        run: bash scripts/release-flags.sh "$(jq -r '.version' src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev mold

      # Keep the Windows build/target dir short (C:/t): whisper.cpp's nested
      # CMake TryCompile paths can exceed the 260-char MAX_PATH that MSBuild's
      # FileTracker enforces. tauri-action honours CARGO_TARGET_DIR for artifact
      # discovery (see tauri-action/src/utils.ts).
      - name: Short CARGO_TARGET_DIR (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: echo "CARGO_TARGET_DIR=C:/t" >> $GITHUB_ENV

      # The windows-latest image (mid windows-2025/2026 migration) ships VS 18
      # 2026, but the preinstalled CMake is too old to know that generator —
      # whisper-rs-sys's build fails with "CMake Error: generator: Visual
      # Studio 18 2026". Install the latest CMake, which recognises it.
      - name: Upgrade CMake (Windows)
        if: matrix.platform == 'windows-latest'
        uses: lukka/get-cmake@latest

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # webrtc-audio-processing builds the bundled APM (dictation echo
      # cancellation) with meson and ninja, which no runner image ships. pip
      # rather than apt/brew/choco so every leg gets the same version: Ubuntu
      # 22.04 packages meson 0.61, which is older than the abseil wrap expects.
      # The build also fetches abseil-cpp from github.com while it runs.
      - name: Install meson and ninja
        shell: bash
        run: python -m pip install --upgrade meson ninja

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-directories: ${{ matrix.platform == 'windows-latest' && 'C:/t' || '' }}

      # A restored Windows build cache (C:/t) may hold a CMakeCache.txt from an
      # older VS generator (e.g. VS 17 2022). When the runner image moves to a
      # newer VS (18 2026), CMake aborts: "generator does not match the generator
      # used previously". Drop the stale CMake config so whisper-rs-sys
      # reconfigures against the current toolchain (sccache still caches the
      # actual compiles, so the rebuild cost is minimal).
      - name: Clear stale CMake cache (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          if (Test-Path C:/t) {
            Get-ChildItem -Path C:/t -Recurse -Force -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -eq 'CMakeCache.txt' -or $_.Name -eq 'CMakeFiles' } |
              Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Import macOS signing certificate
        if: startsWith(matrix.platform, 'macos-')
        env:
          DEVELOPER_ID_CERT_BASE64: ${{ secrets.DEVELOPER_ID_CERT_BASE64 }}
          DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_PATH=$RUNNER_TEMP/cert.p12
          echo "$DEVELOPER_ID_CERT_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$DEVELOPER_ID_CERT_PASSWORD" \
            -T /usr/bin/codesign
          rm -f "$CERT_PATH"

          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application:" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Write Apple API key file for notarization
        if: startsWith(matrix.platform, 'macos-')
        env:
          NOTARIZE_KEY_BASE64: ${{ secrets.NOTARIZE_KEY_BASE64 }}
          NOTARIZE_KEY_ID: ${{ secrets.NOTARIZE_KEY_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${NOTARIZE_KEY_ID}.p8"
          echo "$NOTARIZE_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # sccache
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
          CARGO_INCREMENTAL: "0"
          CMAKE_C_COMPILER_LAUNCHER: "sccache"
          CMAKE_CXX_COMPILER_LAUNCHER: "sccache"
          # mold linker on Linux
          RUSTFLAGS: ${{ matrix.label == 'Linux-x64' && '-C link-arg=-fuse-ld=mold' || '' }}
          # macOS signing — uses certificate imported in previous step
          APPLE_CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERT_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          # macOS notarization — API key written to file in previous step
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          APPLE_API_ISSUER: ${{ secrets.NOTARIZE_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.NOTARIZE_KEY_ID }}
          # Updater artifact signing
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # whisper.cpp build flags per platform:
          # - macOS: override -march to avoid i8mm detection mismatch on M-series < M4 (Metal GPU always active)
          # - Linux: -fPIC required for whisper-rs-sys static linking
          # - Windows: whisper-rs is CPU-only (Vulkan backend's shader build is broken on the runner); -Z7 for sccache MSVC compat
          CMAKE_C_FLAGS: ${{ matrix.label == 'macOS-ARM' && '-march=armv8.4-a' || matrix.label == 'Linux-x64' && '-fPIC' || matrix.label == 'Windows-x64' && '-Z7' || '' }}
          CMAKE_CXX_FLAGS: ${{ matrix.label == 'macOS-ARM' && '-march=armv8.4-a' || matrix.label == 'Linux-x64' && '-fPIC' || matrix.label == 'Windows-x64' && '-Z7' || '' }}
        with:
          tauriScript: pnpm tauri
          tagName: v__VERSION__
          releaseName: 'TUICommander v__VERSION__'
          releaseBody: 'Download the appropriate installer for your platform.'
          releaseDraft: true
          prerelease: ${{ steps.flags.outputs.prerelease == 'true' }}
          includeUpdaterJson: true
          # tauri.conf.json enables the non-default dictation feature for bundles.
          args: ${{ matrix.args }}

      - name: Cleanup macOS keychain
        if: always() && startsWith(matrix.platform, 'macos-')
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$APPLE_API_KEY_PATH" 2>/dev/null || true

  remote-daemon:
    # tauri-action creates the draft at the end of the desktop build. Fast daemon
    # builds must not upload by tag before that release exists.
    needs: build
    permissions:
      contents: write
    uses: ./.github/workflows/remote-daemon.yml

  finalize-release:
    timeout-minutes: 15
    needs: [build, remote-daemon]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Check tag matches version
        if: github.ref_type == 'tag'
        run: bash scripts/check-release-tag.sh "$GITHUB_REF_NAME"

      - name: Build release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          TAG="v${VERSION}"

          # Extract changelog section for this version
          mkdir -p .tmp/tuic-tests
          awk "/^## \[${VERSION}\]/{found=1; next} /^## \[/{if(found) exit} found" CHANGELOG.md > .tmp/tuic-tests/changelog-section.md

          # Build release body: changelog + download legend
          {
            echo "## What's Changed"
            echo ""
            if [ -s .tmp/tuic-tests/changelog-section.md ]; then
              cat .tmp/tuic-tests/changelog-section.md
            else
              echo "See [CHANGELOG.md](https://github.com/sstraus/tuicommander/blob/main/CHANGELOG.md) for details."
            fi
            echo ""
            # Download legend (quoted heredoc — no variable expansion)
            cat <<'LEGEND'
          ---

          📦 **Downloads**

          Pick the right build for your system:
          LEGEND
            # Version-specific filenames (unquoted heredoc for variable expansion)
            cat <<FILENAMES

          * 🍎 **macOS** (Apple Silicon)
              \`TUICommander_${VERSION}_aarch64.dmg\`
              (alt: \`TUICommander_aarch64.app.tar.gz\`)
          * 🪟 **Windows** (64-bit)
              \`TUICommander_${VERSION}_x64-setup.exe\`
          * 🐧 **Linux** (Debian / Ubuntu)
              \`TUICommander_${VERSION}_amd64.deb\`
          * 🐧 **Linux** (RHEL / Fedora / CentOS)
              \`TUICommander-${VERSION}-1.x86_64.rpm\`
          * 🐧 **Linux** (portable)
              \`TUICommander_${VERSION}_amd64.AppImage\`
          FILENAMES
            cat <<'FOOTER'

          ---

          🔐 **Verify** (optional)

          Each release includes `.sig` files for signature verification.

          ---

          💻 **Install via terminal**

          ```bash
          # macOS (Homebrew)
          brew install sstraus/tap/tuicommander

          # macOS / Linux
          curl -fsSL https://tuicommander.com/install.sh | sh
          ```

          ```powershell
          # Windows (PowerShell)
          irm https://tuicommander.com/install.ps1 | iex
          ```
          FOOTER
          } > .tmp/tuic-tests/release-body.md

          # GitHub rejects bodies over 125000 characters. A byte budget is stricter
          # for UTF-8; reserve the complete download footer and full-changelog link.
          python3 - "${TAG}" <<'PY'
          from pathlib import Path
          import sys

          path = Path(".tmp/tuic-tests/release-body.md")
          body = path.read_bytes()
          if len(body) > 120000:
              notes, separator, footer = body.rpartition("\n---\n\n📦 **Downloads**".encode("utf-8"))
              assert separator, "Release download footer not found"
              footer = separator + footer
              link = (f"\n\n[Full changelog](https://github.com/sstraus/tuicommander/blob/{sys.argv[1]}/CHANGELOG.md)"
                      " — release notes truncated.\n").encode("utf-8")
              budget = 120000 - len(footer) - len(link)
              # Keep only complete lines, including for an oversized single line.
              prefix = notes[:budget]
              prefix = prefix[:prefix.rfind(b"\n") + 1]
              path.write_bytes(prefix + link + footer)
          PY

          # A stable release leaves "latest" to GitHub, as before; a prerelease never takes it.
          eval "$(bash scripts/release-flags.sh "${VERSION}")"
          latest_flag=()
          [[ "${latest}" == false ]] && latest_flag=(--latest=false)
          gh release edit "${TAG}" --notes-file .tmp/tuic-tests/release-body.md --draft=false \
            --prerelease="${prerelease}" "${latest_flag[@]}"

      - name: Publish beta updater feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish-beta-feed.sh "$(jq -r '.version' src-tauri/tauri.conf.json)"
