name: Notify homebrew tap

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      prerelease:
        required: true
        type: boolean
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: true

jobs:
  notify:
    # The tap formula tracks stable releases; a beta or nightly must not replace it.
    if: ${{ !inputs.prerelease && !github.event.release.prerelease && startsWith(inputs.tag || github.event.release.tag_name, 'v') }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to homebrew-tap
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          repository: sstraus/homebrew-tap
          event-type: release-published
          client-payload: '{"repo": "tuicommander", "version": "${{ inputs.tag || github.event.release.tag_name }}"}'
