name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Keep the sccache server alive across a compile longer than its 600s idle timer —
# see the note in release.yml.
#
# RUST_VERSION pins the compiler. `dtolnay/rust-toolchain@stable` floats: a new
# stable turns fresh clippy lints and rustfmt reflows into a red main for whoever
# pushes next, which has now happened three times (7db734f9, 20e58629, and the
# 1.98 lints cleared on 2026-08-31 while CI was still green on an older stable).
# To bump: raise the version HERE and in release.yml, nightly.yml, remote-daemon.yml
# and audit.yml in one commit, after `cargo clippy --all-targets -- -D warnings` and
# `cargo fmt --check` pass locally on that toolchain. CI then runs on the new
# compiler as part of that commit, so a breakage lands on its author.
# See docs/guides/ci.md.
env:
  SCCACHE_IDLE_TIMEOUT: "0"
  RUST_VERSION: "1.99.1"

jobs:
  socket:
    timeout-minutes: 15
    name: Socket Security
    runs-on: ubuntu-22.04
    if: github.event_name == 'pull_request'
    # Informational supply-chain scan — never a hard PR blocker. Socket's
    # sfw-wrapped installs add a network dependency on Socket's service, and an
    # upstream action retirement (socketdev/socket-security-action was deleted)
    # previously failed every PR at "Set up job". continue-on-error keeps the
    # scan running + reporting without gating merges on Socket availability.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      # Socket Firewall (free): blocks known-malicious npm/cargo packages at
      # install time. The legacy socket-security-action manifest scanner was
      # retired (repo deleted), so SocketDev/action now installs the `sfw`
      # wrapper and we run the installs through it. No Socket API token needed.
      # Pinned to an immutable SHA per Socket's supply-chain guidance.
      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Scan pnpm install through Socket Firewall
        run: sfw pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Scan cargo fetch through Socket Firewall
        run: cd src-tauri && sfw cargo fetch

  gitlink:
    timeout-minutes: 5
    name: Plugins pin is pushed
    runs-on: ubuntu-22.04
    steps:
      # No submodule checkout: an unpushed pin would fail that step before this check ran.
      - uses: actions/checkout@v6
      - run: scripts/check-gitlink-reachable.sh
      - run: TMPDIR="$RUNNER_TEMP" scripts/test-check-gitlink-reachable.sh

  frontend-checks:
    timeout-minutes: 20
    name: Frontend checks
    runs-on: ubuntu-22.04
    steps:
      # The plugins submodule carries the built-in plugin sources that
      # src/__tests__/plugins/*.test.ts import directly; without it vitest
      # cannot resolve them and the suite fails to collect.
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Release body size workflow contracts
        run: python3 .github/workflows/tests/test-release-body-limit.py

      - name: Remote daemon release workflow contracts
        run: python3 .github/workflows/tests/test-remote-daemon-release.py

      - name: Frontend shard workflow contracts
        run: python3 .github/workflows/tests/test-frontend-shards.py

      - name: Shell tests
        run: make test-shell

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      # A `scripts/*` gitignore rule once hid a script that CI and package.json call.
      - name: Referenced scripts are tracked
        run: grep -ohE 'scripts/[A-Za-z0-9_./-]+\.(mjs|sh|js|py)' package.json .github/workflows/*.yml | sort -u | xargs git ls-files --error-unmatch

      - name: Third-party notices (JavaScript)
        run: |
          node scripts/third-party-notices.mjs --self-test
          node scripts/third-party-notices.mjs --check --only js

  # The isolated suite took 1134-1141s on hosted Linux, versus 327s locally,
  # and later exceeded 20 minutes while still progressing. Partition the full
  # suite across runners, not extra workers competing on the same four vCPUs.
  frontend-tests:
    timeout-minutes: 20
    name: Frontend tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Runner resources
        run: |
          node -e 'const os = require("node:os"); console.log({node: process.version, cpus: os.cpus().length, parallelism: os.availableParallelism(), memoryGiB: os.totalmem() / 2 ** 30})'

      # File-level timings stay visible without a line per passing test.
      # Keep isolation, async-leak detection and the config's four-worker cap.
      - name: Tests
        run: bash scripts/with-test-tmp.sh pnpm exec vitest run --reporter=default --shard=${{ matrix.shard }}/4

  # Preserve the existing required check name. A failed/cancelled/skipped shard
  # must fail this gate, not cause it to be skipped and accepted as successful.
  frontend:
    timeout-minutes: 5
    name: Frontend (typecheck + tests)
    runs-on: ubuntu-22.04
    needs: [frontend-checks, frontend-tests]
    if: always()
    steps:
      - name: Require checks and every test shard
        env:
          CHECKS_RESULT: ${{ needs.frontend-checks.result }}
          TESTS_RESULT: ${{ needs.frontend-tests.result }}
        run: test "$CHECKS_RESULT" = success && test "$TESTS_RESULT" = success

  # Always runs: clippy + tests on Linux (fastest, catches most issues)
  rust:
    timeout-minutes: 60
    name: Rust (Linux-x64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # src/plugins.rs embeds the bundled plugins with include_str!, and they
          # live in the `plugins` submodule. Without this the crate cannot compile
          # at all: "couldn't read src/../../plugins/plan/manifest.json".
          submodules: recursive

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev mold

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # webrtc-audio-processing builds the bundled APM (dictation echo
      # cancellation) with meson and ninja, which no runner image ships. pip
      # rather than apt so every leg gets the same version: Ubuntu 22.04
      # packages meson 0.61, which is older than the abseil wrap expects.
      - name: Install meson and ninja
        run: python -m pip install --upgrade meson ninja

      # shell_integration.rs launches the claude/codex wrappers in bash, zsh
      # AND fish. fish is on none of the runner images, and the tests used to
      # drop it silently when absent — so its half of the matrix reported as
      # passed without ever running. The script installs all three and fails
      # if any cannot be launched rc-free (fish needs >= 3.3 for --no-config).
      - name: Install launch-matrix shells
        run: scripts/install-launch-shells.sh

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Create dist stub for include_dir
        # Both shells, because the SPA fallback serves mobile.html for /mobile/*
        # and index.html for everything else. A stub carrying index.html alone
        # 404s every mobile deep link, which fails a test a real `vite build`
        # passes — the stub has to have the shape the build produces.
        run: mkdir -p dist && for f in index mobile; do echo '<html></html>' > "dist/$f.html"; done

      - name: Create sidecar stub for Tauri build.rs
        run: |
          target=$(rustc --print host-tuple)
          touch "src-tauri/binaries/tuic-bridge-${target}"
          touch "src-tauri/binaries/tuic-${target}"

      - name: Third-party notices (Rust)
        run: node scripts/third-party-notices.mjs --check --only rust

      - name: Desktop frontend embedding
        shell: bash
        run: bash scripts/check-desktop-embedding.sh

      - name: Clippy
        working-directory: src-tauri
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
          CARGO_INCREMENTAL: "0"
          CMAKE_C_COMPILER_LAUNCHER: "sccache"
          CMAKE_CXX_COMPILER_LAUNCHER: "sccache"
          CMAKE_C_FLAGS: '-fPIC'
          CMAKE_CXX_FLAGS: '-fPIC'
          RUSTFLAGS: '-C link-arg=-fuse-ld=mold'
        # bm25 is a vendored third-party patch (patches/bm25): not ours to lint.
        run: cargo clippy --workspace --exclude bm25 --all-targets --features dictation -- -D warnings

      - name: Tests
        working-directory: src-tauri
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
          CARGO_INCREMENTAL: "0"
          CMAKE_C_COMPILER_LAUNCHER: "sccache"
          CMAKE_CXX_COMPILER_LAUNCHER: "sccache"
          CMAKE_C_FLAGS: '-fPIC'
          CMAKE_CXX_FLAGS: '-fPIC'
          RUSTFLAGS: '-C link-arg=-fuse-ld=mold'
          TUIC_FIXTURE_FEATURES: dictation
        run: bash ../scripts/with-test-tmp.sh cargo nextest run --workspace --features dictation --profile ci


      # This check invokes nextest and compiled Rust tests. Keep it out of the
      # frontend shell-test discovery, whose job installs neither prerequisite.
      - name: Nextest fixture setup scope
        run: |
          bash scripts/with-test-tmp.sh bash scripts/check-fixture-build-profile.sh
          bash scripts/with-test-tmp.sh python3 scripts/check-fixture-build-graph.py
          bash scripts/with-test-tmp.sh bash scripts/check-nextest-fixture-scope.sh

      # nextest does not run doctests — run them separately so doc examples stay
      # covered. Linux-only: doctests are platform-independent logic.
      - name: Doctests
        working-directory: src-tauri
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
          CARGO_INCREMENTAL: "0"
          CMAKE_C_COMPILER_LAUNCHER: "sccache"
          CMAKE_CXX_COMPILER_LAUNCHER: "sccache"
          CMAKE_C_FLAGS: '-fPIC'
          CMAKE_CXX_FLAGS: '-fPIC'
          RUSTFLAGS: '-C link-arg=-fuse-ld=mold'
        run: bash ../scripts/with-test-tmp.sh cargo test --doc --workspace --features dictation

  # Verify tuic-remote compiles without the desktop feature (catches missing cfg
  # gates) AND run the headless test suite. The `#[cfg(not(feature = "desktop"))]`
  # tests — headless router refusals and the named-instance CLI contract — exist
  # only in this configuration, so nothing else in CI ever executes them.
  check-remote:
    timeout-minutes: 45
    name: Remote daemon (no-default-features)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          # See the rust job: include_str! reaches into the `plugins` submodule.
          submodules: recursive

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev mold

      - name: Install launch-matrix shells
        run: scripts/install-launch-shells.sh

      # The Ego settings fixture replay imports tomllib (Python 3.11+); 22.04 ships 3.10.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Check tuic-remote
        working-directory: src-tauri
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
          CARGO_INCREMENTAL: "0"
          CMAKE_C_COMPILER_LAUNCHER: "sccache"
          CMAKE_CXX_COMPILER_LAUNCHER: "sccache"
          CMAKE_C_FLAGS: '-fPIC'
          CMAKE_CXX_FLAGS: '-fPIC'
          RUSTFLAGS: '-C link-arg=-fuse-ld=mold'
        run: cargo check --no-default-features --bin tuic-remote

      # --workspace selects desktop-only members independently of feature gates.
      # Dictation remains covered by the desktop workspace jobs.
      - name: Headless tests
        working-directory: src-tauri
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
          CARGO_INCREMENTAL: "0"
          CMAKE_C_COMPILER_LAUNCHER: "sccache"
          CMAKE_CXX_COMPILER_LAUNCHER: "sccache"
          CMAKE_C_FLAGS: '-fPIC'
          CMAKE_CXX_FLAGS: '-fPIC'
          RUSTFLAGS: '-C link-arg=-fuse-ld=mold'
        run: bash ../scripts/with-test-tmp.sh cargo nextest run --no-default-features --workspace --exclude tuic-dictation --profile ci

  # Push to main only: verify build on macOS and Windows.
  # GPU notes:
  # - macOS: whisper-rs compiled with Metal (target-specific dep) — always GPU.
  # - Windows: whisper-rs is CPU-only. The Vulkan backend's vulkan-shaders-gen
  #   sub-build is chronically broken on the runner, so dictation runs on CPU.
  #   CUDA support is optional (add Jimver/cuda-toolkit + --features cuda if needed).
  rust-cross:
    timeout-minutes: 90
    name: Rust (${{ matrix.label }})
    # Runs on pull_request too, not just push. Gating it on push meant macOS and
    # Windows breakage was only ever discovered after a merge to main.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macOS-ARM
          - platform: windows-latest
            label: Windows-x64

    runs-on: ${{ matrix.platform }}
    steps:
      # Git for Windows defaults to core.autocrlf=true, which rewrites every
      # checked-out file to CRLF. The suite compares file bytes it wrote itself
      # against bytes git handed back, so that default made the Windows leg
      # assert on different content than the other two. Global and before the
      # checkout, because the test fixtures create their own repositories in
      # temp directories, which no .gitattributes of ours would reach.
      - name: Keep line endings verbatim (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # See the rust job: include_str! reaches into the `plugins` submodule.
          submodules: recursive

      # Keep the Windows build/target dir short (C:/t): whisper.cpp's nested
      # CMake TryCompile paths can exceed the 260-char MAX_PATH that MSBuild's
      # FileTracker enforces (it ignores LongPathsEnabled). The bundled WebRTC
      # APM needs the same thing for the same reason — abseil's
      # hashtablez_sampler_force_weak_definition.cc resolves one character past
      # 260 from the meson build dir under a normal target path.
      - name: Short CARGO_TARGET_DIR (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: echo "CARGO_TARGET_DIR=C:/t" >> $GITHUB_ENV

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # webrtc-audio-processing builds the bundled APM (dictation echo
      # cancellation) with meson and ninja, which no runner image ships. pip
      # rather than apt/brew/choco so every leg gets the same version: Ubuntu
      # 22.04 packages meson 0.61, which is older than the abseil wrap expects.
      - name: Install meson and ninja
        shell: bash
        run: python -m pip install --upgrade meson ninja

      # The launch matrix is #[cfg(unix)], so only the macOS leg needs it.
      - name: Install launch-matrix shells
        if: matrix.platform == 'macos-latest'
        run: scripts/install-launch-shells.sh

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          # On Windows the real target dir is CARGO_TARGET_DIR=C:/t (MAX_PATH workaround).
          # rust-cache's `workspaces` input joins target with root, so it can't point at
          # an absolute path — use `cache-directories` instead.
          cache-directories: ${{ matrix.platform == 'windows-latest' && 'C:/t' || '' }}
          # A failed/cancelled test run must not discard an hour of compilation.
          # sccache cannot cache linked test/binary targets; retain C:/t too.
          cache-on-failure: ${{ matrix.platform == 'windows-latest' }}

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      # A restored Windows build cache (C:/t) may hold a CMakeCache.txt from an
      # older VS generator (e.g. VS 17 2022). When the runner image moves to a
      # newer VS (18 2026), CMake aborts: "generator does not match the generator
      # used previously". Drop the stale CMake config so whisper-rs-sys
      # reconfigures against the current toolchain (sccache still caches the
      # actual compiles, so the rebuild cost is minimal).
      - name: Clear stale CMake cache (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          if (Test-Path C:/t) {
            Get-ChildItem -Path C:/t -Recurse -Force -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -eq 'CMakeCache.txt' -or $_.Name -eq 'CMakeFiles' } |
              Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Create dist stub for include_dir
        shell: bash
        # Both shells, because the SPA fallback serves mobile.html for /mobile/*
        # and index.html for everything else. A stub carrying index.html alone
        # 404s every mobile deep link, which fails a test a real `vite build`
        # passes — the stub has to have the shape the build produces.
        run: mkdir -p dist && for f in index mobile; do echo '<html></html>' > "dist/$f.html"; done

      - name: Create sidecar stub for Tauri build.rs
        shell: bash
        run: |
          target=$(rustc --print host-tuple)
          touch "src-tauri/binaries/tuic-bridge-${target}"
          touch "src-tauri/binaries/tuic-${target}"
          # Windows needs .exe extension for sidecar resolution
          if [[ "$target" == *windows* ]]; then
            touch "src-tauri/binaries/tuic-bridge-${target}.exe"
            touch "src-tauri/binaries/tuic-${target}.exe"
          fi

      - name: Desktop frontend embedding
        shell: bash
        run: bash scripts/check-desktop-embedding.sh

      - name: Clippy
        working-directory: src-tauri
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
          CARGO_INCREMENTAL: "0"
          CMAKE_C_COMPILER_LAUNCHER: "sccache"
          CMAKE_CXX_COMPILER_LAUNCHER: "sccache"
          # Use -Z7: Git Bash converts /Z7 into a Windows path before native Cargo.
          CMAKE_C_FLAGS: ${{ matrix.label == 'macOS-ARM' && '-march=armv8.4-a' || matrix.label == 'Windows-x64' && '-Z7' || '' }}
          CMAKE_CXX_FLAGS: ${{ matrix.label == 'macOS-ARM' && '-march=armv8.4-a' || matrix.label == 'Windows-x64' && '-Z7' || '' }}
        # bm25 is a vendored third-party patch (patches/bm25): not ours to lint.
        run: cargo clippy --workspace --exclude bm25 --all-targets --features dictation -- -D warnings

      # Windows runs the suite too. It used to be skipped, which is why Windows
      # regressions only ever surfaced in a user's build.
      - name: Tests
        working-directory: src-tauri
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
          CARGO_INCREMENTAL: "0"
          # Windows d27aa1739 spent 45m36s compiling tests before the fixture
          # setup rebuilt dev for 18m15s. As on macOS, skip optimizing workspace
          # harnesses; Cargo.toml keeps dependencies and tuic-terminal at O1.
          CARGO_PROFILE_TEST_OPT_LEVEL: "0"
          # The setup build must share nextest's profile and feature graph.
          TUIC_FIXTURE_FEATURES: dictation
          CMAKE_C_COMPILER_LAUNCHER: "sccache"
          CMAKE_CXX_COMPILER_LAUNCHER: "sccache"
          # Use -Z7: Git Bash converts /Z7 into a Windows path before native Cargo.
          CMAKE_C_FLAGS: ${{ matrix.label == 'macOS-ARM' && '-march=armv8.4-a' || matrix.label == 'Windows-x64' && '-Z7' || '' }}
          CMAKE_CXX_FLAGS: ${{ matrix.label == 'macOS-ARM' && '-march=armv8.4-a' || matrix.label == 'Windows-x64' && '-Z7' || '' }}
        run: bash ../scripts/with-test-tmp.sh cargo nextest run --workspace --features dictation --profile ci
