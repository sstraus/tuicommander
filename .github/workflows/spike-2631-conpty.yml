name: Windows ConPTY OSC spike 2631

on:
  push:
    branches: [feat/2631-1f9f-windows-conpty-osc-spike]
    paths:
      - .github/workflows/spike-2631-conpty.yml
      - scripts/agent-capture/windows-hook-osc.rs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Keep original line endings
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Build smallest faithful native PTY harness
        shell: pwsh
        run: |
          $spike = Join-Path $env:RUNNER_TEMP "conpty-spike"
          $evidence = Join-Path $env:RUNNER_TEMP "conpty-evidence"
          New-Item -ItemType Directory -Force "$spike/src", $evidence | Out-Null
          @'
          [package]
          name = "windows-hook-osc"
          version = "0.0.0"
          edition = "2024"
          [workspace]
          [dependencies]
          portable-pty = "=0.9.0"
          '@ | Set-Content "$spike/Cargo.toml"
          Copy-Item scripts/agent-capture/windows-hook-osc.rs "$spike/src/main.rs"
          cargo build --manifest-path "$spike/Cargo.toml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record host and console-child output
        shell: pwsh
        run: |
          $spike = Join-Path $env:RUNNER_TEMP "conpty-spike"
          $evidence = Join-Path $env:RUNNER_TEMP "conpty-evidence"
          $PSVersionTable | Out-String | Set-Content "$evidence/powershell.txt"
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber | Format-List | Out-String | Set-Content "$evidence/windows.txt"
          rustc -Vv | Set-Content "$evidence/rustc.txt"
          git rev-parse HEAD | Set-Content "$evidence/commit.txt"
          Copy-Item "$spike/Cargo.lock" "$evidence/harness-Cargo.lock"
          & "$spike/target/debug/windows-hook-osc.exe" capture $evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-conpty-osc-2631
          path: ${{ runner.temp }}/conpty-evidence/
          if-no-files-found: error
          retention-days: 14
