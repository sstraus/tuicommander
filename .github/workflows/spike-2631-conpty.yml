name: Windows ConPTY OSC spike 2631

on:
  push:
    branches: [feat/2631-1f9f-windows-conpty-osc-spike]
    paths:
      - .github/workflows/spike-2631-conpty.yml
      - scripts/agent-capture/windows-hook-osc.rs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Keep original line endings
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Build smallest faithful native PTY harness
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .tmp/conpty-spike/src, .tmp/conpty-evidence | Out-Null
          @'
          [package]
          name = "windows-hook-osc"
          version = "0.0.0"
          edition = "2024"
          [workspace]
          [dependencies]
          portable-pty = "=0.9.0"
          '@ | Set-Content .tmp/conpty-spike/Cargo.toml
          Copy-Item scripts/agent-capture/windows-hook-osc.rs .tmp/conpty-spike/src/main.rs
          cargo build --manifest-path .tmp/conpty-spike/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record host and console-child output
        shell: pwsh
        run: |
          $PSVersionTable | Out-String | Set-Content .tmp/conpty-evidence/powershell.txt
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber | Format-List | Out-String | Set-Content .tmp/conpty-evidence/windows.txt
          rustc -Vv | Set-Content .tmp/conpty-evidence/rustc.txt
          git rev-parse HEAD | Set-Content .tmp/conpty-evidence/commit.txt
          Copy-Item .tmp/conpty-spike/Cargo.lock .tmp/conpty-evidence/harness-Cargo.lock
          & .tmp/conpty-spike/target/debug/windows-hook-osc.exe capture .tmp/conpty-evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-conpty-osc-2631
          path: .tmp/conpty-evidence/
          if-no-files-found: error
          retention-days: 14
