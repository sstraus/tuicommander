name: Nightly

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'stories/**'
      - '.github/ISSUE_TEMPLATE/**'

concurrency:
  group: nightly
  cancel-in-progress: true

# Keep the sccache server alive across a compile longer than its 600s idle timer —
# see the note in release.yml. RUST_VERSION pins the compiler; bump it in lockstep
# with ci.yml, release.yml, remote-daemon.yml and audit.yml — see the note in
# ci.yml and docs/guides/ci.md.
env:
  SCCACHE_IDLE_TIMEOUT: "0"
  RUST_VERSION: "1.99.1"

jobs:
  cleanup:
    timeout-minutes: 10
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Move nightly tag to current commit
        run: |
          git tag -f nightly
          git push origin nightly --force

      - name: Delete old nightly release (keep tag, refresh published_at)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete the whole rolling nightly release (KEEPING the tag we just moved) so
          # cleanup recreates it fresh before either matrix starts — resetting published_at
          # to the current run time. The previous approach deleted only the ASSETS and
          # left the release object intact; GitHub freezes published_at at the initial
          # draft->published transition and NEVER refreshes it on tag moves, asset swaps,
          # or note edits, so the public page showed a stale "released this Apr 13" date.
          #
          # Rejected alternative — PATCH the release to set published_at: the GitHub
          # "Update a release" API does not accept published_at as a writable field, so
          # delete+recreate is the only route that refreshes it. Do NOT revert this to an
          # asset-only cleanup. --cleanup-tag=false preserves the nightly tag (and the
          # stable /releases/tag/nightly URL); `|| true` tolerates the first-ever run
          # when no release exists yet.
          gh release delete nightly --repo "$GITHUB_REPOSITORY" --cleanup-tag=false --yes || true
          gh release create nightly \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "TUICommander Nightly" \
            --notes "Rolling build from main. Assets are uploaded as builds complete." \
            --prerelease \
            --latest=false

  build:
    timeout-minutes: 90
    needs: cleanup
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            label: macOS-ARM
          - platform: ubuntu-22.04
            args: ''
            label: Linux-x64
          - platform: windows-latest
            args: '--bundles nsis'
            label: Windows-x64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
        with:
          # src/plugins.rs embeds the bundled plugins with include_str!, and
          # they live in the `plugins` submodule. Without this the crate
          # cannot compile at all.
          submodules: recursive

      - name: Patch nightly version
        shell: bash
        run: bash scripts/patch-nightly-version.sh

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev mold

      # Keep the Windows build/target dir short (C:/t): whisper.cpp's nested
      # CMake TryCompile paths can exceed the 260-char MAX_PATH that MSBuild's
      # FileTracker enforces. tauri-action honours CARGO_TARGET_DIR for artifact
      # discovery (see tauri-action/src/utils.ts).
      - name: Short CARGO_TARGET_DIR (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: echo "CARGO_TARGET_DIR=C:/t" >> $GITHUB_ENV

      # The windows-latest image (mid windows-2025/2026 migration) ships VS 18
      # 2026, but the preinstalled CMake is too old to know that generator —
      # whisper-rs-sys's build fails with "CMake Error: generator: Visual
      # Studio 18 2026". Install the latest CMake, which recognises it.
      - name: Upgrade CMake (Windows)
        if: matrix.platform == 'windows-latest'
        uses: lukka/get-cmake@latest

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # webrtc-audio-processing builds the bundled APM (dictation echo
      # cancellation) with meson and ninja, which no runner image ships. pip
      # rather than apt/brew/choco so every leg gets the same version: Ubuntu
      # 22.04 packages meson 0.61, which is older than the abseil wrap expects.
      # The build also fetches abseil-cpp from github.com while it runs.
      - name: Install meson and ninja
        shell: bash
        run: python -m pip install --upgrade meson ninja

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-directories: ${{ matrix.platform == 'windows-latest' && 'C:/t' || '' }}

      # A restored Windows build cache (C:/t) may hold a CMakeCache.txt from an
      # older VS generator (e.g. VS 17 2022). When the runner image moves to a
      # newer VS (18 2026), CMake aborts: "generator does not match the generator
      # used previously". Drop the stale CMake config so whisper-rs-sys
      # reconfigures against the current toolchain (sccache still caches the
      # actual compiles, so the rebuild cost is minimal).
      - name: Clear stale CMake cache (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          if (Test-Path C:/t) {
            Get-ChildItem -Path C:/t -Recurse -Force -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -eq 'CMakeCache.txt' -or $_.Name -eq 'CMakeFiles' } |
              Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Import macOS signing certificate
        if: startsWith(matrix.platform, 'macos-')
        env:
          DEVELOPER_ID_CERT_BASE64: ${{ secrets.DEVELOPER_ID_CERT_BASE64 }}
          DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_PATH=$RUNNER_TEMP/cert.p12
          echo "$DEVELOPER_ID_CERT_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$DEVELOPER_ID_CERT_PASSWORD" \
            -T /usr/bin/codesign
          rm -f "$CERT_PATH"

          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application:" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Write Apple API key file for notarization
        if: startsWith(matrix.platform, 'macos-')
        env:
          NOTARIZE_KEY_BASE64: ${{ secrets.NOTARIZE_KEY_BASE64 }}
          NOTARIZE_KEY_ID: ${{ secrets.NOTARIZE_KEY_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${NOTARIZE_KEY_ID}.p8"
          echo "$NOTARIZE_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        timeout-minutes: 60
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # sccache
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
          CARGO_INCREMENTAL: "0"
          CMAKE_C_COMPILER_LAUNCHER: "sccache"
          CMAKE_CXX_COMPILER_LAUNCHER: "sccache"
          # mold linker on Linux
          RUSTFLAGS: ${{ matrix.label == 'Linux-x64' && '-C link-arg=-fuse-ld=mold' || '' }}
          APPLE_CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERT_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          APPLE_API_ISSUER: ${{ secrets.NOTARIZE_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.NOTARIZE_KEY_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # whisper.cpp build flags per platform + -Z7 for sccache MSVC compat
          CMAKE_C_FLAGS: ${{ matrix.label == 'macOS-ARM' && '-march=armv8.4-a' || matrix.label == 'Linux-x64' && '-fPIC' || matrix.label == 'Windows-x64' && '-Z7' || '' }}
          CMAKE_CXX_FLAGS: ${{ matrix.label == 'macOS-ARM' && '-march=armv8.4-a' || matrix.label == 'Linux-x64' && '-fPIC' || matrix.label == 'Windows-x64' && '-Z7' || '' }}
        with:
          tauriScript: pnpm tauri
          tagName: nightly
          releaseName: 'TUICommander Nightly'
          releaseBody: |
            **Rolling build from `main` — always the latest code.**

            Updated on every push to main. May contain experimental features.
            For stable releases, see the [latest versioned release](https://github.com/sstraus/tuicommander/releases/latest).
          releaseDraft: false
          prerelease: true
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Cleanup macOS keychain
        if: always() && startsWith(matrix.platform, 'macos-')
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$APPLE_API_KEY_PATH" 2>/dev/null || true

  # tuic-remote + tuic-bridge for the four daemon targets, uploaded to the rolling
  # `nightly` release under the same asset names release.yml uses. `needs: cleanup`
  # is what keeps the old binaries out: cleanup deletes the whole release, so an
  # upload that ran before it would be deleted with it. Cleanup recreates the
  # prerelease before either matrix starts, so daemon uploads do not depend on
  # desktop builds succeeding. latest.json is written by tauri-action alone.
  remote-daemon:
    needs: cleanup
    permissions:
      contents: write
    uses: ./.github/workflows/remote-daemon.yml
    with:
      nightly: true

  update-notes:
    timeout-minutes: 15
    needs: build
    if: always() && needs.build.result != 'cancelled'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Generate changelog and update release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST_STABLE=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          echo "Last stable tag: $LAST_STABLE"

          mkdir -p .tmp/tuic-tests
          NOTES=$(mktemp .tmp/tuic-tests/nightly-notes.XXXXXX)
          trap 'rm -f "$NOTES"' EXIT
          {
            echo '**Rolling build from `main` — always the latest code.**'
            echo ''
            echo 'Updated on every push to main. May contain experimental features.'
            echo 'For stable releases, see the [latest versioned release](https://github.com/sstraus/tuicommander/releases/latest).'
            echo ''
            echo '---'
            echo ''
            echo "## Changes since $LAST_STABLE"
            echo ''
          } > "$NOTES"

          FEATS=$(git log "$LAST_STABLE"..HEAD --oneline --no-merges --grep='^feat' | sed 's/^[a-f0-9]* /- /')
          FIXES=$(git log "$LAST_STABLE"..HEAD --oneline --no-merges --grep='^fix' | sed 's/^[a-f0-9]* /- /')
          OTHER=$(git log "$LAST_STABLE"..HEAD --oneline --no-merges --invert-grep --grep='^feat' --grep='^fix' | sed 's/^[a-f0-9]* /- /')

          if [ -n "$FEATS" ]; then
            printf '### Features\n%s\n\n' "$FEATS" >> "$NOTES"
          fi
          if [ -n "$FIXES" ]; then
            printf '### Fixes\n%s\n\n' "$FIXES" >> "$NOTES"
          fi
          if [ -n "$OTHER" ]; then
            printf '### Other\n%s\n\n' "$OTHER" >> "$NOTES"
          fi

          python3 scripts/cap-release-notes.py "$NOTES" \
            "https://github.com/$GITHUB_REPOSITORY/compare/$LAST_STABLE...main"
          gh release edit nightly --repo "$GITHUB_REPOSITORY" --notes-file "$NOTES"

      - name: Create versioned nightly release
        if: needs.build.result == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")

          # Only create versioned release when version contains -nightly
          if [[ "$VERSION" != *-nightly* ]]; then
            echo "Version $VERSION is not a nightly — skipping"
            exit 0
          fi

          # Strip timestamp suffix to get base tag (1.2.6-nightly.20260525.t1343 → 1.2.6-nightly)
          BASE="${VERSION%%-nightly*}-nightly"
          TAG="v${BASE}"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" &>/dev/null; then
            echo "Release $TAG already exists — skipping"
            exit 0
          fi

          echo "Creating versioned release: $TAG"
          git tag -f "$TAG"
          git push origin "$TAG" --force

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "TUICommander $TAG" \
            --notes "Nightly build from \`main\`. Download the latest rolling build from the [nightly release](https://github.com/sstraus/tuicommander/releases/tag/nightly)." \
            --prerelease

  retry-failed:
    timeout-minutes: 15
    needs: build
    if: failure()
    permissions:
      actions: write
    runs-on: ubuntu-latest
    steps:
      - name: Retry failed jobs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Retrying failed jobs for run ${{ github.run_id }}..."
          gh run rerun ${{ github.run_id }} --failed --repo "$GITHUB_REPOSITORY"
