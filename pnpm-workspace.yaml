# Delay every direct and transitive release by seven days. No exclusions.
minimumReleaseAge: 10080

allowBuilds:
  esbuild: true

# pnpm 11 no longer reads the "pnpm.overrides" field from package.json — overrides
# live here. These pin transitive deps for security and to dedupe versions.
overrides:
  # Pin the runtime sanitizer, including Mermaid's transitive copy.
  dompurify: "3.4.17"
  # Development-only dependency via Stryker.
  qs: "6.16.0"
  # Patched serialization and source-map lines (frontend advisory audit).
  seroval: "^1.6.3"
  source-map-js: "^1.2.2"
  "vite-plugin-purgecss>purgecss": "^8.0.0"
  minimatch: ">=3.1.4"
  brace-expansion: ">=1.1.13"
  picomatch: ">=4.0.4"
  "rollup-plugin-visualizer>picomatch": ">=4.0.4"
  # Keep the direct build dependency and all transitive consumers on one version.
  rollup: "4.62.2"
  # vite-plugin-purgecss@0.2.13 pulls in vite 6.x (CVE: dev-server file read,
  # path traversal) plus old postcss/ws. Pin the build-only vite to the patched line.
  "vite-plugin-purgecss>vite": ">=6.4.3"
  # happy-dom (test-only) pulls in ws < 8.20.1 (uninitialized memory disclosure).
  ws: ">=8.20.1"
  # esbuild < 0.28.1 (build/test-only, via vite + vitest) — GHSA-gv7w-rqvm-qjhr.
  # vite 8 is already latest and still resolves 0.27.7; pin to the patched line.
  esbuild: ">=0.28.1"
  # nanoid < 3.3.18 (build/test-only, via vite > postcss) — GHSA-2v37-7h3g-55p8:
  # a custom generator loops forever when size is 0. Stay on the 3.x line: the
  # only consumer is postcss, which imports the CJS `nanoid/non-secure`, and
  # a bare ">=" resolves to the ESM-only 6.x.
  nanoid: "^3.3.18"
  # zod < 4.6.6 (dev-only, via @stryker-mutator) — GHSA-mrhx-c7xc-m3w5.
  zod: "^4.6.6"
  # undici < 8.12.2 (test-only, via jsdom) — GHSA-xjj6-f33q-929c,
  # GHSA-4w7w-5xrc-9h26, GHSA-2m5v-pch6-74hx, GHSA-qrxm-fqhp-jwvm.
  undici: "^8.12.2"
