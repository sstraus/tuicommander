<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Design Mode</title><link rel="stylesheet" href="panel.css"></head>
<body><header><h1>Design Mode</h1><p id="repo">Connecting to TUICommander…</p><p id="connection" role="status"></p><div class="actions"><button id="pick" class="primary">Pick element</button><button id="multi">Multi-pick</button><button id="stop">Stop</button></div></header>
<details id="servers"><summary id="servers-title">Dev servers</summary><div id="server-list"></div></details><details><summary>Agent actions</summary><div id="action-history"></div></details><section id="errors" aria-label="Page errors"></section><main id="cards"><p id="empty" class="muted">Pick an element on your page, then add a comment.</p></main>
<section><button id="grant-capture">Let agents capture any site</button><button id="grant-host">Allow eval on this host</button><button id="grant-all">Allow agents on all sites</button><p id="grants" role="status"></p></section><footer><label for="agent">Send feedback to</label><select id="agent"><option value="">No agents connected</option></select><button id="send" class="primary" disabled>Send to agent</button><p id="status" role="status"></p></footer>
<script type="module" src="panel.js"></script></body></html>
